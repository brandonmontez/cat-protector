name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build universal app bundle
        run: UNIVERSAL=1 Scripts/build-app.sh

      - name: Zip app
        run: make dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Cat-Protector
          path: build/Cat-Protector.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Cat-Protector.zip
          generate_release_notes: true
